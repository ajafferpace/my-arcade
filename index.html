<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam's Arcade</title>
  <style>
    :root {
      --bg: #001f2d;
      --panel: rgba(8, 30, 42, 0.8);
      --ink: #ecf6ff;
      --accent: #ffd166;
      --accent-2: #7bdff2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);
      background: linear-gradient(180deg, #021b27, #0b1f2d 45%, #071b2b);
      color: var(--ink);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 960px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 1;
    }

    .subtitle {
      margin: 0 0 32px;
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      opacity: 0.9;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .game-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 22px;
      background: var(--panel);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255, 209, 102, 0.9);
    }

    .game-card h2 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    .game-card p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.5;
      opacity: 0.9;
    }

    .game-action {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .game-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .game-card {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Adam's Arcade</h1>
    <p class="subtitle">Choose a game to play</p>

    <div class="game-grid">
      <a class="game-card" href="star-catcher.html">
        <h2>Star Catcher</h2>
        <p>Catch 10 stars before 3 misses and keep your streak alive.</p>
        <span class="game-action">Play Star Catcher &rarr;</span>
      </a>

      <a class="game-card" href="falling-platforms.html">
        <h2>Falling Platforms</h2>
        <p>Jump across every platform before the falling ground takes you down.</p>
        <span class="game-action">Play Falling Platforms &rarr;</span>
      </a>
    </div>
  </main>
</body>
</html>
