<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam's Arcade</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background-color: #00ffff;
      color: #102a43;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 760px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 1;
    }

    p {
      margin: 0 0 36px;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      line-height: 1.5;
    }

    .play-button {
      display: inline-block;
      padding: 18px 64px;
      border: 4px solid #102a43;
      border-radius: 16px;
      background: #ffd93d;
      color: #102a43;
      font-size: 2rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 0 #102a43;
    }

    .play-button:hover,
    .play-button:focus-visible {
      background: #ffe875;
      transform: translateY(-2px);
    }

    .play-button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #102a43;
    }
  </style>
</head>
<body>
  <main>
    <h1>Adam's Arcade</h1>
    <p>Welcome to the arcade! Jump into Star Catcher, dodge soccer balls, and see how many stars you can catch.</p>
    <a class="play-button" href="game-backup.html">Start</a>
  </main>
</body>
</html>
