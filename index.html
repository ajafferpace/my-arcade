<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam's Arcade</title>
  <style>
    :root {
      --bg: #001f2d;
      --panel: rgba(8, 30, 42, 0.8);
      --ink: #ecf6ff;
      --accent: #ffd166;
      --accent-2: #7bdff2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);
      background: linear-gradient(180deg, #021b27, #0b1f2d 45%, #071b2b);
      color: var(--ink);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 960px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 1;
    }

    .subtitle {
      margin: 0 0 32px;
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      opacity: 0.9;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .game-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 22px;
      background: var(--panel);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255, 209, 102, 0.9);
    }

    .game-card h2 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    .game-card p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.5;
      opacity: 0.9;
    }

    .game-action {
      color: var(--accent);
      font-weight: 700;
    }

    button.game-card {
      width: 100%;
      font-family: inherit;
      cursor: pointer;
    }

    button.game-card.image-card {
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .game-card-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .tag-game-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(1, 12, 22, 0.92);
    }

    .tag-game-modal.open,
    .sponge-hockey-modal.open {
      display: grid;
    }

    .tag-game-window,
    .sponge-hockey-window {
      width: min(96vw, 960px);
      height: min(92vh, 680px);
      display: grid;
      grid-template-rows: 48px 1fr;
      overflow: hidden;
      background: #071b33;
      border: 2px solid var(--accent-2);
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    }

    .tag-game-bar,
    .sponge-hockey-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 6px 16px;
      background: #031626;
    }

    .tag-game-bar strong,
    .sponge-hockey-bar strong {
      color: var(--accent);
    }

    .back-button {
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font: 700 0.95rem Arial, sans-serif;
      cursor: pointer;
    }

    .back-button:hover,
    .back-button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tag-game-window iframe,
    .sponge-hockey-window iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #071b33;
    }

    .sponge-hockey-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(1, 12, 22, 0.92);
    }

    @media (max-width: 600px) {
      .game-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .game-card {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Adam's Arcade</h1>
    <p class="subtitle">Choose a game to play</p>

    <div class="game-grid">
      <a class="game-card" href="game-backup.html">
        <h2>Star Catcher</h2>
        <p>Catch 10 stars before 3 misses and keep your streak alive.</p>
        <span class="game-action">Play Star Catcher &rarr;</span>
      </a>

      <a class="game-card" href="falling-platforms.html">
        <h2>Falling Platforms</h2>
        <p>Jump across every platform before the falling ground takes you down.</p>
        <span class="game-action">Play Falling Platforms &rarr;</span>
      </a>

      <button class="game-card" id="openTagGame" type="button">
        <h2>Starfield Tag</h2>
        <p>Tag the computer players and avoid getting tagged yourself.</p>
        <span class="game-action">Play Starfield Tag &rarr;</span>
      </button>

      <button class="game-card image-card" id="openSpongeHockey" type="button">
        <img class="game-card-image" src="sponge-hockey-card.png" alt="Sponge Hockey — two-player basketball hockey. Play Sponge Hockey.">
      </button>

    </div>
  </main>

  <div class="tag-game-modal" id="tagGameModal" role="dialog" aria-modal="true" aria-label="Starfield Tag game">
    <div class="tag-game-window">
      <div class="tag-game-bar">
        <strong>Starfield Tag</strong>
        <button class="back-button" id="closeTagGame" type="button">&larr; Back to Arcade</button>
      </div>
      <iframe id="tagGameFrame" title="Starfield Tag" allow="fullscreen"></iframe>
    </div>
  </div>

  <div class="sponge-hockey-modal" id="spongeHockeyModal" role="dialog" aria-modal="true" aria-label="Sponge Hockey game">
    <div class="sponge-hockey-window">
      <div class="sponge-hockey-bar">
        <strong>Sponge Hockey</strong>
        <button class="back-button" id="closeSpongeHockey" type="button">&larr; Back to Arcade</button>
      </div>
      <iframe id="spongeHockeyFrame" title="Sponge Hockey" allow="fullscreen"></iframe>
    </div>
  </div>

  <script>
    const openTagGame = document.getElementById("openTagGame");
    const closeTagGame = document.getElementById("closeTagGame");
    const tagGameModal = document.getElementById("tagGameModal");
    const tagGameFrame = document.getElementById("tagGameFrame");
    const openSpongeHockey = document.getElementById("openSpongeHockey");
    const closeSpongeHockey = document.getElementById("closeSpongeHockey");
    const spongeHockeyModal = document.getElementById("spongeHockeyModal");
    const spongeHockeyFrame = document.getElementById("spongeHockeyFrame");

    function openTagGameModal() {
      tagGameFrame.src = "tag-game.html";
      tagGameModal.classList.add("open");
      document.body.style.overflow = "hidden";
      closeTagGame.focus();
    }

    function closeTagGameModal() {
      tagGameModal.classList.remove("open");
      document.body.style.overflow = "";
      tagGameFrame.removeAttribute("src");
      openTagGame.focus();
    }

    function openSpongeHockeyModal() {
      spongeHockeyFrame.src = "sponge-hockey.html";
      spongeHockeyModal.classList.add("open");
      document.body.style.overflow = "hidden";
      closeSpongeHockey.focus();
    }

    function closeSpongeHockeyModal() {
      spongeHockeyModal.classList.remove("open");
      document.body.style.overflow = "";
      spongeHockeyFrame.removeAttribute("src");
      openSpongeHockey.focus();
    }

    openTagGame.addEventListener("click", openTagGameModal);
    closeTagGame.addEventListener("click", closeTagGameModal);
    openSpongeHockey.addEventListener("click", openSpongeHockeyModal);
    closeSpongeHockey.addEventListener("click", closeSpongeHockeyModal);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && tagGameModal.classList.contains("open")) {
        closeTagGameModal();
      }
      if (event.key === "Escape" && spongeHockeyModal.classList.contains("open")) {
        closeSpongeHockeyModal();
      }
    });
    window.addEventListener("message", (event) => {
      if (event.data === "closeTagGame") {
        closeTagGameModal();
      }
      if (event.data === "closeSpongeHockey") {
        closeSpongeHockeyModal();
      }
    });
  </script>
</body>
</html>
